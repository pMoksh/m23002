<h1>🎵 My Music</h1>

<div class="container">

    <aside id="songList"></aside>

    <main id="player">

        <img id="cover" src="covers/default.jpg">

        <h2 id="title">Select a Song</h2>

        <p id="artist"></p>

        <div class="buttons">
            <button id="prevBtn">⏮ Previous</button>
            <button id="nextBtn">Next ⏭</button>
        </div>

        <audio id="audio" controls></audio>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
